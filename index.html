<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/pwa-192x192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Lahfa'h</title>

  <!-- Global Error Logger & In-App Browser Detection -->
  <script>
    (function () {
      // Catch errors that happen before the DOM is even ready
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        var message = 'Error: ' + msg + '\nLine: ' + lineNo + '\nCol: ' + columnNo;
        setTimeout(function () {
          var debug = document.getElementById('debug-error');
          if (!debug) {
            debug = document.createElement('div');
            debug.id = 'debug-error';
            debug.style = 'position:fixed;top:0;left:0;width:100%;background:#A62B2B;color:white;z-index:999999;padding:15px;font-size:12px;word-break:break-all;box-shadow:0 4px 10px rgba(0,0,0,0.3);';
            document.body.appendChild(debug);
          }
          debug.innerHTML = "<strong>⚠️ Erreur Système Détectée :</strong><br/>" + message.replace(/\n/g, '<br/>');
        }, 100);
        return false;
      };

      // Detect Instagram/FB on iOS
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isInstagram = (ua.indexOf('Instagram') > -1) || (ua.indexOf('FBAN') > -1) || (ua.indexOf('FBAV') > -1);

      if (isInstagram && /iPhone|iPad|iPod/.test(ua)) {
        document.addEventListener('DOMContentLoaded', function () {
          var prompt = document.createElement('div');
          prompt.style = 'position:fixed;top:20px;left:20px;right:20px;background:#000;color:white;padding:20px;border-radius:20px;z-index:999998;text-align:center;font-size:14px;box-shadow:0 15px 40px rgba(0,0,0,0.6);border:2px solid #ff0080;';
          prompt.innerHTML = "<div style='font-size:24px;margin-bottom:10px;'>💡 Conseil Instagram</div>" +
            "Instagram bloque souvent l'affichage. Si la page reste blanche :<br/><br/>" +
            "1. Cliquez sur les <strong>3 points (•••)</strong> en haut à droite<br/>" +
            "2. Choisissez <strong>'Ouvrir dans Safari'</strong>.<br/><br/>";

          var close = document.createElement('div');
          close.innerHTML = "FERMER";
          close.style = 'margin-top:10px;font-weight:bold;color:#ff0080;cursor:pointer;background:rgba(255,255,255,0.1);padding:10px;border-radius:10px;';
          close.onclick = function () { prompt.remove(); };

          prompt.appendChild(close);
          document.body.appendChild(prompt);
        });
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
