<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/pwa-192x192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Lahfa'h</title>

  <!-- Global Error Logger & In-App Browser Detection -->
  <script>
    (function () {
      // 0. Path-to-Hash Redirect (Public Catalogue Fix)
      // If user lands on /catalogue, redir to /#/catalogue so HashRouter sees it as public
      if (window.location.pathname === '/catalogue' || window.location.pathname === '/catalogue/') {
        window.location.replace('/#/catalogue' + window.location.search);
        return; // Stop execution to allow redirect
      }

      // 1. ServiceWorker Crash Fix (Polyfill)
      // Instagram/DataSaver browsers often disable SW but leave the object undefined, causing crashes.
      if (typeof navigator !== 'undefined') {
        if (!navigator.serviceWorker) {
          navigator.serviceWorker = {
            register: function () { return Promise.resolve({}); },
            ready: Promise.resolve({}),
            addEventListener: function () { },
            removeEventListener: function () { }
          };
        }
      }

      // 2. Global Error Logger
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        var message = 'Error: ' + msg + '\nLine: ' + lineNo;
        setTimeout(function () {
          var debug = document.getElementById('debug-error');
          if (!debug) {
            debug = document.createElement('div');
            debug.id = 'debug-error';
            debug.style = 'position:fixed;top:0;left:0;width:100%;background:#A62B2B;color:white;z-index:999999;padding:15px;font-size:12px;word-break:break-all;box-shadow:0 4px 10px rgba(0,0,0,0.3);';
            document.body.appendChild(debug);
          }
          debug.innerHTML = "<strong>⚠️ Erreur Système :</strong><br/>" + message;
        }, 100);
        return false;
      };

      // 3. Failsafe: Show instructions if app doesn't load in 4 seconds
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.innerHTML.trim() === '') {
          var ua = navigator.userAgent || navigator.vendor || window.opera;
          var prompt = document.createElement('div');
          prompt.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;color:white;z-index:999998;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-family:sans-serif;';

          var actionText = /iPhone|iPad|iPod/.test(ua) ? "Ouvrir dans Safari" : "Ouvrir dans Chrome";

          prompt.innerHTML = "<h1 style='font-size:24px;margin-bottom:20px;'>⚠️ Affichage Bloqué</h1>" +
            "<p style='margin-bottom:30px;color:#ccc;'>Le navigateur intégré bloque l'application.</p>" +
            "<div style='background:#ff0080;color:white;padding:15px 30px;border-radius:30px;font-weight:bold;font-size:18px;margin-bottom:20px;'>" +
            "1. Cliquez sur les 3 points (•••) ↗️<br/>2. Choisissez '" + actionText + "'" +
            "</div>" +
            "<button onclick='location.reload()' style='background:transparent;border:1px solid #666;color:#888;padding:10px 20px;border-radius:10px;margin-top:20px;'>Réessayer</button>";

          document.body.appendChild(prompt);
        }
      }, 4000);
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
